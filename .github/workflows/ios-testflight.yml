name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 180

    env:
      HUD_BUNDLE_ID: ${{ secrets.HUD_BUNDLE_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      # No Apple-ID/session secrets are needed here.
      # Select the newest Xcode 27 already present on GitHub's xcode-27 image.
      - name: Select newest installed Xcode 27
        shell: bash
        run: |
          set -euo pipefail

          echo "Xcode installations present on this runner:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true
          echo

          BEST_APP=""
          BEST_BUILD=""
          BEST_SERIAL=-1

          for candidate in /Applications/Xcode*.app; do
            [[ -d "$candidate/Contents/Developer" ]] || continue

            info="$(
              DEVELOPER_DIR="$candidate/Contents/Developer" \
              xcodebuild -version 2>/dev/null || true
            )"

            version="$(printf '%s\n' "$info" | awk '/^Xcode /{print $2; exit}')"
            build="$(printf '%s\n' "$info" | awk '/Build version/{print $3; exit}')"

            [[ "$version" == 27.* ]] || continue
            [[ "$build" =~ ^27A([0-9]+)[A-Za-z0-9]*$ ]] || continue

            serial="${BASH_REMATCH[1]}"
            echo "Found Xcode $version build $build at $candidate"

            if (( serial > BEST_SERIAL )); then
              BEST_SERIAL="$serial"
              BEST_BUILD="$build"
              BEST_APP="$candidate"
            fi
          done

          if [[ -z "$BEST_APP" ]]; then
            echo "::error::No Xcode 27 installation was found on this GitHub runner."
            exit 1
          fi

          echo
          echo "Selecting newest installed Xcode: $BEST_APP ($BEST_BUILD)"
          sudo xcode-select --switch "$BEST_APP/Contents/Developer"

          echo "Selected toolchain:"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

          # 27A5228h = Xcode 27 beta 4, which App Store Connect rejected
          # in our 2026-08-18 TestFlight run with error 90534.
          #
          # We intentionally do NOT hard-code a guessed beta-5/beta-6 build
          # number. Anything newer than beta 4 is allowed through; App Store
          # Connect remains the authority on the currently accepted beta/RC.
          if (( BEST_SERIAL <= 5228 )); then
            echo "::error title=GitHub Xcode image is still too old::Newest installed Xcode is $BEST_BUILD (beta 4 generation). App Store Connect rejected this toolchain with 90534. No app/signing change can fix that binary. Re-run after GitHub refreshes the xcode-27 image."
            exit 1
          fi

          echo "Xcode build $BEST_BUILD is newer than the rejected beta-4 toolchain; continuing."

      - name: Install build tools
        run: |
          brew install xcodegen
          sudo gem install fastlane

      - name: Validate iOS 27 device ScreenCaptureKit framework
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          test -d "$DEVICE_SDK/System/Library/Frameworks/ScreenCaptureKit.framework"
          echo "Device ScreenCaptureKit found: $DEVICE_SDK/System/Library/Frameworks/ScreenCaptureKit.framework"
          if [ -d "$SIM_SDK/System/Library/Frameworks/ScreenCaptureKit.framework" ]; then
            echo "Simulator framework directory exists; Swift module availability will still be handled conditionally."
          else
            echo "Simulator ScreenCaptureKit framework is absent; expected for the device-only iOS 27 sample path."
          fi

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" HUDController/Info.plist
          /usr/libexec/PlistBuddy -c "Set :SPOTIFY_CLIENT_ID $SPOTIFY_CLIENT_ID" HUDController/Info.plist
          echo "Generated bundle version:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" HUDController/Info.plist

      - name: Install signing certificate and App Store profile
        shell: bash
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/hud-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Verify signing identity and provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          echo "Available code-signing identities:"
          security find-identity -v -p codesigning

          echo "Provisioning profile summary:"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist"

          security find-identity -v -p codesigning | grep -q "Apple Distribution"
          echo "Apple Distribution identity is available."

      - name: Validate Spotify observable internals
        run: |
          grep -A1 "@ObservationIgnored" ios/HUDController/Media/SpotifyMediaController.swift | grep -q "private lazy var"
          echo "Spotify lazy internals are excluded from Observation."

      - name: Verify App Store build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Selected Xcode:"
          xcodebuild -version

          XCODE_BUILD="$(xcodebuild -version | awk '/Build version/{print $3}')"
          if [[ "$XCODE_BUILD" =~ ^27A([0-9]+)[A-Za-z0-9]*$ ]]; then
            XCODE_SERIAL="${BASH_REMATCH[1]}"
          else
            echo "::error::Unexpected Xcode 27 build identifier: $XCODE_BUILD"
            exit 1
          fi

          # The 2026-08-18 upload proved 27A5228h (beta 4) is rejected.
          # Do not waste time archiving with that same toolchain again.
          if (( XCODE_SERIAL <= 5228 )); then
            echo "::error::Xcode $XCODE_BUILD is the rejected beta-4 generation. Wait for GitHub's xcode-27 image refresh and rerun."
            exit 1
          fi

          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 27

          echo "Generated app settings:"
          cd ios
          xcodebuild \
            -project HUDController.xcodeproj \
            -scheme HUDController \
            -showBuildSettings \
            | grep -E 'TARGETED_DEVICE_FAMILY|PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET'

      - name: Archive
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project HUDController.xcodeproj \
            -scheme HUDController \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HUDController.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$HUD_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Verify archived bundle version
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PLIST="$RUNNER_TEMP/HUDController.xcarchive/Products/Applications/HUDController.app/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVE_PLIST")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST")
          echo "Archived version: $SHORT_VERSION ($VERSION)"
          test "$VERSION" = "$GITHUB_RUN_NUMBER"

      - name: Export App Store IPA
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>provisioningProfiles</key>
            <dict><key>${HUD_BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HUDController.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Create App Store Connect API key JSON
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY_CONTENT="$(echo "$ASC_KEY_P8_BASE64" | base64 --decode | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"
          cat > "$RUNNER_TEMP/api_key.json" <<EOF
          {
            "key_id": "$ASC_KEY_ID",
            "issuer_id": "$ASC_ISSUER_ID",
            "key": $KEY_CONTENT,
            "in_house": false
          }
          EOF

      - name: Confirm IPA exists before upload
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)"
          test -n "$IPA"
          test -f "$IPA"
          echo "IPA ready for upload: $IPA"
          ls -lh "$IPA"

      - name: Upload to TestFlight
        shell: bash
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -1)"
          echo "Submitting IPA to App Store Connect..."
          fastlane pilot upload \
            --ipa "$IPA" \
            --api_key_path "$RUNNER_TEMP/api_key.json" \
            --skip_waiting_for_build_processing true
          echo "fastlane pilot upload command completed successfully."

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HUDController-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
