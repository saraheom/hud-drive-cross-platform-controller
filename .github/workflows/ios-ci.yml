name: iOS CI

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"

jobs:
  build:
    runs-on: xcode-27
    env:
      HUD_BUNDLE_ID: com.example.hudcontroller
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 27
