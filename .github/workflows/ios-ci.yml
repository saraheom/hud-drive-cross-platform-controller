name: iOS CI — Ambient Test (Xcode 26)

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
      - ".github/workflows/ios-testflight-ambient-ios26.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

jobs:
  build:
    runs-on: macos-26
    env:
      HUD_BUNDLE_ID: com.example.hudcontroller
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          SELECTED="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -n "$SELECTED" ]]; then
            echo "Selecting $SELECTED"
            sudo xcode-select -s "$SELECTED/Contents/Developer"
          else
            echo "No explicit Xcode_26*.app bundle found; checking runner default."
          fi

          xcodebuild -version
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iPhoneOS SDK: $IOS_SDK"
          echo "Simulator SDK: $SIM_SDK"
          test "${IOS_SDK%%.*}" -eq 26
          test "${SIM_SDK%%.*}" -eq 26

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate temporary ambient-test source boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Navigation/ExternalNavigationCapture.swift' ios/project-ios26-ambient.yml
          test -f ios/HUDController/AmbientTest/ExternalNavigationCaptureIOS26Stub.swift
          test -f ios/HUDController/AmbientTest/HudNavigationViewIOS26.swift
          if grep -q 'screen-capture' ios/project-ios26-ambient.yml; then
            echo "ERROR: temporary iOS 26 ambient project must not request the screen-capture background mode."
            exit 1
          fi
          echo "iOS 27 ScreenCaptureKit path is excluded from the temporary ambient-test target."

      - name: Generate iOS 26 ambient-test project
        working-directory: ios
        run: xcodegen generate --spec project-ios26-ambient.yml

      - name: Validate generated build settings
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HUDController.xcodeproj \
            -scheme HUDController \
            -showBuildSettings \
            | tee "$RUNNER_TEMP/build-settings.txt"
          grep -q 'AMBIENT_IOS26_TEST' "$RUNNER_TEMP/build-settings.txt"
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 17.0' "$RUNNER_TEMP/build-settings.txt"
          echo "Temporary ambient-test compilation condition is active."

      - name: Select available iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          candidates.sort(reverse=True)
          runtime, name, udid = candidates[0]
          print(udid)
          print(f"Selected simulator: {name} ({runtime})", file=sys.stderr)
          ')"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator UDID: $UDID"

      - name: Build ambient test for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project HUDController.xcodeproj \
            -scheme HUDController \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run ambient-compatible unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project HUDController.xcodeproj \
            -scheme HUDController \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test
