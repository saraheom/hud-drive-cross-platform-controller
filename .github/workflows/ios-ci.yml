name: iOS CI

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"

jobs:
  build:
    runs-on: macos-26
    env:
      HUDWAY_BUNDLE_ID: com.example.hudwaycontroller
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_26.6.app/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Validate App Shortcut utterances
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          path = Path("ios/HUDWAYController/Shortcuts/HudwayShortcuts.swift")
          text = path.read_text()
          for match in re.finditer(r'phrases:\s*\[(.*?)\]', text, re.S):
              strings = re.findall(r'"([^"]+)"', match.group(1))
              bad = [s for s in strings if r'\(.applicationName)' not in s]
              if bad:
                  print("Invalid App Shortcut phrases:", bad)
                  sys.exit(1)
          print("App Shortcut utterances OK")
          PY

      - name: Sanity-check UIKit usage
        run: |
          if grep -R "UIDevice" ios/HUDWAYController --include='*.swift' >/dev/null; then
            grep -R "import UIKit" ios/HUDWAYController --include='*.swift' >/dev/null
          fi
          echo "UIKit sanity check OK"

      - name: Validate generated test-host product names
        working-directory: ios
        run: |
          APP_PRODUCT=$(xcodebuild -project HUDWAYController.xcodeproj -scheme HUDWAYController -showBuildSettings 2>/dev/null | awk -F' = ' '/^[[:space:]]*FULL_PRODUCT_NAME = / {print $2; exit}')
          EXECUTABLE=$(xcodebuild -project HUDWAYController.xcodeproj -scheme HUDWAYController -showBuildSettings 2>/dev/null | awk -F' = ' '/^[[:space:]]*EXECUTABLE_NAME = / {print $2; exit}')
          echo "App product: $APP_PRODUCT"
          echo "Executable: $EXECUTABLE"
          test "$APP_PRODUCT" = "HUDWAYController.app"
          test "$EXECUTABLE" = "HUDWAYController"
          echo "Test-host product naming OK"

      - name: Select available iPhone Simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          candidates.sort(reverse=True)
          runtime, name, udid = candidates[0]
          print(udid)
          print(f"Selected simulator: {name} ({runtime})", file=sys.stderr)
          ')"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator UDID: $UDID"

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project HUDWAYController.xcodeproj \
            -scheme HUDWAYController \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project HUDWAYController.xcodeproj \
            -scheme HUDWAYController \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test
