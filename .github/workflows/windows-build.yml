name: Build Windows BLE Tester

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r windows/requirements-dev.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile windows/app.py windows/protocol.py
          echo "Python syntax OK"

      - name: Run protocol tests
        run: python -m pytest -q

      - name: Verify Windows BLE runtime imports
        run: |
          python -c "import bleak; import winrt.windows.devices.bluetooth; import winrt.windows.devices.bluetooth.advertisement; import winrt.windows.devices.bluetooth.genericattributeprofile; import winrt.windows.devices.enumeration; import winrt.windows.foundation; import winrt.windows.foundation.collections; import winrt.windows.storage.streams; print('Bleak/PyWinRT imports OK')"
          python -m pip show bleak winrt-runtime winrt-Windows.Foundation.Collections

      - name: Build Windows executable
        working-directory: windows
        run: |
          pyinstaller --clean --noconfirm HUDWAY_BLE_Tester.spec
          pyinstaller --clean --noconfirm HUDWAY_BLE_Tester_Diagnostic.spec

      - name: Create distribution ZIP
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item windows/dist/HUDWAY_BLE_Tester.exe artifacts/HUDWAY_BLE_Tester.exe
          Copy-Item windows/dist/HUDWAY_BLE_Tester_Diagnostic.exe artifacts/HUDWAY_BLE_Tester_Diagnostic.exe
          Copy-Item README.md artifacts/README.md
          Compress-Archive -Path artifacts/HUDWAY_BLE_Tester.exe, artifacts/HUDWAY_BLE_Tester_Diagnostic.exe, artifacts/README.md -DestinationPath artifacts/HUDWAY_BLE_Tester-windows-x64.zip -Force

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUDWAY-BLE-Tester-Windows
          path: |
            artifacts/HUDWAY_BLE_Tester.exe
            artifacts/HUDWAY_BLE_Tester_Diagnostic.exe
            artifacts/HUDWAY_BLE_Tester-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
