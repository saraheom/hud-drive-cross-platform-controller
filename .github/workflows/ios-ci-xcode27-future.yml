name: Future iOS 27 Screen Capture CI (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    env:
      HUD_BUNDLE_ID: com.example.hudcontroller
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode 27 toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iPhoneOS SDK: $IOS_SDK"
          echo "Simulator SDK: $SIM_SDK"
          test "${IOS_SDK%%.*}" -ge 27
          test "${SIM_SDK%%.*}" -ge 27

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate iOS 27 device ScreenCaptureKit framework
        run: |
          set -euo pipefail
          DEVICE_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          test -d "$DEVICE_SDK/System/Library/Frameworks/ScreenCaptureKit.framework"
          echo "Device ScreenCaptureKit found: $DEVICE_SDK/System/Library/Frameworks/ScreenCaptureKit.framework"
          if [ -d "$SIM_SDK/System/Library/Frameworks/ScreenCaptureKit.framework" ]; then
            echo "Simulator framework directory exists; Swift module availability will still be handled conditionally."
          else
            echo "Simulator ScreenCaptureKit framework is absent; expected for the device-only iOS 27 sample path."
          fi

      - name: Validate simulator does not link ScreenCaptureKit
        run: |
          set -euo pipefail
          if grep -R "weak_framework ScreenCaptureKit" ios/project.yml; then
            echo "ScreenCaptureKit must not be globally linked for simulator builds."
            exit 1
          fi
          echo "No global ScreenCaptureKit linker flag present."

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Validate App Shortcut utterances
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          path = Path("ios/HUDController/Shortcuts/HudShortcuts.swift")
          text = path.read_text()
          for match in re.finditer(r'phrases:\s*\[(.*?)\]', text, re.S):
              strings = re.findall(r'"([^"]+)"', match.group(1))
              bad = [s for s in strings if r'\(.applicationName)' not in s]
              if bad:
                  print("Invalid App Shortcut phrases:", bad)
                  sys.exit(1)
          print("App Shortcut utterances OK")
          PY

      - name: Sanity-check UIKit usage
        run: |
          if grep -R "UIDevice" ios/HUDController --include='*.swift' >/dev/null; then
            grep -R "import UIKit" ios/HUDController --include='*.swift' >/dev/null
          fi
          echo "UIKit sanity check OK"

      - name: Validate generated test-host product names
        working-directory: ios
        run: |
          APP_PRODUCT=$(xcodebuild -project HUDController.xcodeproj -scheme HUDController -showBuildSettings 2>/dev/null | awk -F' = ' '/^[[:space:]]*FULL_PRODUCT_NAME = / {print $2; exit}')
          EXECUTABLE=$(xcodebuild -project HUDController.xcodeproj -scheme HUDController -showBuildSettings 2>/dev/null | awk -F' = ' '/^[[:space:]]*EXECUTABLE_NAME = / {print $2; exit}')
          echo "App product: $APP_PRODUCT"
          echo "Executable: $EXECUTABLE"
          test "$APP_PRODUCT" = "HUDController.app"
          test "$EXECUTABLE" = "HUDController"
          echo "Test-host product naming OK"

      - name: Select available iPhone Simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          candidates.sort(reverse=True)
          runtime, name, udid = candidates[0]
          print(udid)
          print(f"Selected simulator: {name} ({runtime})", file=sys.stderr)
          ')"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator UDID: $UDID"

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project HUDController.xcodeproj \
            -scheme HUDController \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project HUDController.xcodeproj \
            -scheme HUDController \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test
