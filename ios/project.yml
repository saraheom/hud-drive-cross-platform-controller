name: HUDWAYController
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HUDWAYController:
    type: application
    platform: iOS
    sources:
      - path: HUDWAYController
    info:
      path: HUDWAYController/Info.plist
      properties:
        CFBundleDisplayName: HUDWAY Controller
        NSBluetoothAlwaysUsageDescription: HUDWAY Controller uses Bluetooth to communicate with your HUDWAY Drive hardware.
        UIBackgroundModes:
          - bluetooth-central
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${HUDWAY_BUNDLE_ID}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - HUDWAYControllerTests
  HUDWAYControllerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HUDWAYControllerTests
    dependencies:
      - target: HUDWAYController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${HUDWAY_BUNDLE_ID}.tests
