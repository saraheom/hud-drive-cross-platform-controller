name: HUDController
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HUDController:
    type: application
    platform: iOS
    sources:
      - path: HUDController
        excludes:
          # v53 removed this diagnostic experiment. Keep an explicit exclusion
          # so repositories updated by copying over an older checkout cannot
          # accidentally compile a stale local copy.
          - Media/HudTextRendererProbe.swift
    dependencies:
      - package: SpotifyiOS
    info:
      path: HUDController/Info.plist
      properties:
        CFBundleDisplayName: HUD Controller
        NSBluetoothAlwaysUsageDescription: HUD Controller uses Bluetooth to communicate with your HUD and nearby BLE vehicle accessories.
        NSLocationWhenInUseUsageDescription: HUD Controller uses GPS speed and road position to reproduce the original HUD speed and speed-limit behavior.
        NSLocationAlwaysAndWhenInUseUsageDescription: HUD Controller uses location while driving so HUD speed and posted speed limits can continue updating in the background.
        SPOTIFY_CLIENT_ID: ""
        SPOTIFY_REDIRECT_URI: "jjunnyy-hud-login://spotify-callback"
        LSApplicationQueriesSchemes:
          - spotify
        CFBundleURLTypes:
          - CFBundleURLName: com.jjunnyy.hudcontroller.spotify
            CFBundleURLSchemes:
              - jjunnyy-hud-login
        UIBackgroundModes:
          - bluetooth-central
          - location
          - screen-capture
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${HUD_BUNDLE_ID}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - HUDControllerTests
  HUDControllerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HUDControllerTests
        excludes:
          # Removed persistent-text probe experiment tests.
          - V41TextRendererProbeTests.swift
          - AppStateInitializationOrderTests.swift
          # Superseded Apple-arrow regression files. These can remain in an
          # older Git checkout after ZIP-overlay updates, so explicitly exclude
          # them from the generated test target.
          - V59AppleArrowDirectionTests.swift
          - V60AppleArrowComponentIsolationTests.swift
          - V61AppleComponentRegressionTests.swift
          - V62AppleArrowShieldTests.swift
    dependencies:
      - target: HUDController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${HUD_BUNDLE_ID}.tests
